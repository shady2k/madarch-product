edges:
  - { name: quarantines, from: [code.test-quarantine], to: [code.test-case], capability: test-quarantine }
  - { name: fixedBy, from: [code.test-quarantine], to: [code.task], capability: test-quarantine }
  - name: code.contains
    from:
      - code.repository
      - code.directory
    to:
      - code.directory
      - code.file
    capability: git
  - name: code.as-is
    from:
      - code.repository
    to:
      - code.commit
    capability: git
  - name: code.history
    from:
      - code.repository
    to:
      - code.commit
    capability: git
  - name: code.parent
    from:
      - code.commit
    to:
      - code.commit
    capability: git
  - name: code.touched
    from:
      - code.commit
    to:
      - code.file
    capability: git
  - name: code.authored
    from:
      - code.author
    to:
      - code.commit
    capability: git
  - name: code.renamed-from
    from:
      - code.file
    to:
      - code.file
    repeats: true
    discriminator: commit
    capability: git

plugins:
  - { id: test-quarantine, version: 1, path: plugins/test-quarantine, inputs: [code.file], outputs: [code.test-quarantine], closure: [plugins/test-quarantine/plugin.json, plugins/test-quarantine/contract.json, plugins/test-quarantine/entry.ts, plugins/test-quarantine/main.ts, plugins/test-quarantine/parser.ts, plugins/test-quarantine/package.json, plugins/test-quarantine/bun.lock] }
  - { id: consistency, version: 1, path: plugins/consistency, inputs: [code.file], outputs: [consistency.finding], closure: [plugins/consistency/contract.json, plugins/consistency/main.ts, plugins/consistency/plugin.json] }

problems:
  rules:
    missing-reference: { predicate: findings, kind: missing-reference, sonar: bug, severity: major, section: code, action: task, enabled: true, label: { en: "Reference to a missing key", ru: "Ссылка на отсутствующий ключ" } }
    dangling-reference: { predicate: findings, kind: dangling-reference, sonar: bug, severity: major, section: code, action: task, enabled: true, label: { en: "Edge end names a missing key", ru: "Конец ребра ссылается на отсутствующий ключ" } }
    removed-end: { predicate: findings, kind: removed-end, sonar: bug, severity: major, section: code, action: task, enabled: true, label: { en: "Edge ends at a removed vertex", ru: "Ребро ведёт к удалённой вершине" } }
    unevidenced-opinion: { predicate: findings, kind: unevidenced-opinion, sonar: bug, severity: minor, section: code, action: task, enabled: true, label: { en: "Opinion without evidence", ru: "Утверждение без основания" } }
