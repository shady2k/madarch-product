template: templates/file.liquid
source: graph
capability: git
fields:
  - name: repository_node
    type: bigint
    producers:
      - git
    reference: code.repository
  - name: path_id
    type: bigint
    producers:
      - git
  - name: mode
    type: text
    nullable: true
    producers:
      - git
  - name: blob_id
    type: bigint
    nullable: true
    producers:
      - git
  - name: content
    type: text
    nullable: true
    producers:
      - git
key:
  - repository_node
  - path_id
depends-on:
  - code.repository
  - code.directory
history: path
views:
  - state
details:
  - mode
  - blob
  - bytes
  - lines
  - form
  - language
  - candidates
  - commitCount
  - authors
labels:
  en:
    one: File
    many: Files
  ru:
    one: Файл
    many: Файлы
description:
  en: A file of a code repository.
  ru: Файл репозитория кода.
