source: graph
capability: git
fields:
  - name: hash
    type: text
    producers:
      - git
  - name: algorithm
    type: text
    producers:
      - git
  - name: subject
    type: text
    nullable: true
    producers:
      - git
  - name: author_date
    type: timestamp
    nullable: true
    producers:
      - git
  - name: author_offset_min
    type: integer
    nullable: true
    producers:
      - git
  - name: commit_date
    type: timestamp
    nullable: true
    producers:
      - git
  - name: commit_offset_min
    type: integer
    nullable: true
    producers:
      - git
key:
  - hash
derives-from:
  - code.file
  - code.repository
origin: history
history: commit
details:
  - author
  - authorEmail
  - subject
  - authoredAt
  - committedAt
  - merge
  - mergedBranch
labels:
  en:
    one: Commit
    many: Commits
  ru:
    one: Коммит
    many: Коммиты
description:
  en: A change in the repository's history, with its author and the files it
    touched.
  ru: Изменение в истории репозитория, его автор и затронутые файлы.
