      ru: "Правило, которое соблюдает продукт (BR-1, BR-2 ...), и код, который его реализует."
  doc.decision:
    template: templates/entity-text.md
    source: document
    group: product
    origin: person
    identifier: ADR
    labels:
      en: { one: "Decision", many: "Decisions" }
      ru: { one: "Решение", many: "Решения" }
    description:
      en: "An architecture decision record (ADR-0001 ...): what was decided and why."
      ru: "Запись об архитектурном решении (ADR-0001 ...): что решили и почему."
  doc.requirement:
    template: templates/entity-text.md
    source: document
    group: product
    origin: person
    identifier: [FR, NFR, REQ, PR, US]
    labels:
      en: { one: "Requirement", many: "Requirements" }
      ru: { one: "Требование", many: "Требования" }
    description:
