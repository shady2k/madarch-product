    source: graph
    group: tests
    labels:
      en: { one: "Test case", many: "Test cases" }
      ru: { one: "Тест", many: "Тесты" }
    description:
      en: "A test, and the code it exercises."
      ru: "Тест и код, который он проверяет."
  code.commit:
    template: templates/commit.liquid
    source: graph
    capability: git
    fields:
      - name: hash
        type: text
        producers:
          - git
      - name: algorithm
        type: text
        producers:
          - git
      - name: subject
        type: text
        nullable: true
        producers:
          - git
      - name: author_date
        type: timestamp
        nullable: true
        producers:
          - git
      - name: author_offset_min
        type: integer
        nullable: true
        producers:
          - git
      - name: commit_date
        type: timestamp
        nullable: true
        producers:
          - git
      - name: commit_offset_min
        type: integer
        nullable: true
        producers:
          - git
    key:
      - hash
    depends-on:
      - code.repository
    origin: history
    history: commit
    details:
      - author
      - authorEmail
      - subject
      - authoredAt
      - committedAt
      - merge
      - mergedBranch
    labels:
      en:
        one: Commit
        many: Commits
      ru:
        one: Коммит
        many: Коммиты
    description:
      en: A change in the repository's history, with its author and the files it
        touched.
      ru: Изменение в истории репозитория, его автор и затронутые файлы.
  code.author:
    template: templates/author.liquid
    source: graph
    capability: git
    fields:
      - name: name
        type: text
        producers:
          - git
      - name: email
        type: text
        producers:
          - git
    key:
      - name
      - email
    depends-on:
      - code.commit
    origin: history
    history: author
    labels:
      en:
        one: Author
        many: Authors
      ru:
        one: Автор
        many: Авторы
    description:
      en: A person who made commits.
      ru: Человек, который делал коммиты.
  code.task:
    template: templates/item-plain.md
    source: graph
    group: history
    origin: history
    labels:
      en: { one: "Task", many: "Tasks" }
      ru: { one: "Задача", many: "Задачи" }
    description:
      en: "A tracker task that commit messages name."
      ru: "Задача трекера, которую называют сообщения коммитов."
  question:
    template: templates/question.liquid
    source: markdown
    origin: agent
    folder: docs/questions
    nav: loop
    labels:
      en:
        one: Question
        many: Questions
      ru:
        one: Вопрос
        many: Вопросы
    description:
      en: Something the agent could not settle from the code and the documents; a
        person answers it.
      ru: То, что агент не смог решить по коду и документам; отвечает человек.
  correction:
    template: templates/correction.liquid
    source: markdown
    origin: person
    folder: docs/corrections
    nav: loop
    labels:
      en:
        one: Correction
        many: Corrections
      ru:
        one: Поправка
        many: Поправки
    description:
      en: A person's note that a statement is wrong, and why; the agent takes it into
        account at the next refresh.
      ru: Заметка человека о том, что утверждение неверно, и почему; агент учтёт её
        при следующем обновлении.
  administrator-guide:
    template: templates/guide.liquid
    source: markdown
    origin: agent
    file: docs/guides/administrator.md
    labels:
      en:
        one: Administrator guide
        many: Administrator guide
      ru:
        one: Руководство администратора
        many: Руководство администратора
    description:
      en: Grounded setup and operations, with independent walkthrough status.
      ru: Запуск и эксплуатация с основаниями в исходниках и независимым статусом
        прохождения.
  user-guide:
    template: templates/guide.liquid
    source: markdown
    origin: agent
    file: docs/guides/user.md
    labels:
      en:
        one: User guide
        many: User guide
      ru:
        one: Руководство пользователя
        many: Руководство пользователя
    description:
      en: Supported tasks and API procedures, with known gaps.
      ru: Поддерживаемые задачи и API-процедуры с известными пробелами.
  code.repository:
    template: templates/repository.liquid
    source: graph
    capability: git
    fields:
      - name: name
        type: text
        producers:
          - git
      - name: url
        type: text
        producers:
          - git
      - name: default_branch
        type: text
        nullable: true
        producers:
          - git
    key:
      - name
    depends-on: []
    history: repositories
    labels:
      en:
        one: Repository
        many: Repositories
      ru:
        one: Репозиторий
        many: Репозитории
    description:
      en: "A version control repository: the history and the tree the extractors read;
        it is not a domain repository."
      ru: "Репозиторий системы контроля версий: история и дерево, которые читают
        извлекатели; это не репозиторий предметной области."
  code.directory:
    template: templates/directory.liquid
    source: graph
    capability: git
    fields:
      - name: repository_node
        type: bigint
        producers:
          - git
        reference: code.repository
      - name: path_id
        type: bigint
        producers:
          - git
    key:
      - repository_node
      - path_id
    depends-on:
