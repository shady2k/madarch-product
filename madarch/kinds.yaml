      ru: { one: "Пакет", many: "Пакеты" }
    description:
      en: "The folder a service's manifest sits in, with its tests and frameworks."
      ru: "Папка с манифестом сервиса, его тесты и фреймворки."
  code.module:
    template: templates/module.md
    source: graph
    group: code
    labels:
