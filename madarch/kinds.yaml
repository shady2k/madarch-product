# The kinds this product's wiki shows (decision 0029, docs/decisions/0029-knowledge-in-markdown-graph-as-index.md).
# Each kind names where its entities come from and the template that draws them:
#   source: markdown  the entity is a Markdown file of this repository (a folder of them, or one file)
#   source: graph     the entity is a node of the graph the fill builds from the code repositories
#   source: document  the entity is a section of a Markdown document of this or a code repository that opens with an
#                     identifier (`identifier: UC` takes UC-1, UC-2 ...) or a bold term of a glossary (`terms: [...]`)
# A kind with `file:` is one page; the first such kind is the home page.
# `group` puts the kind in a group of the navigation and the catalogue; `labels` and `description` name and explain
# the kind in each interface language (en, ru); `origin` says how its entities came to be (agent, person, code, history).
# `relations` declares an edge between kinds: {attribute|dirname} puts a part of the entity into the other end's key.
# `documents.exclude` lists Markdown files that are not product documents (the files that steer a coding agent).
# `roles` says, per role a reader can read as (product, analyst, architect, developer, operations, tester), which blocks of a
# template stand open on a page and which groups lead the navigation. A block a role does not open stays on the page, collapsed:
# one page serves every role. A role left out, and the role "everything", open every block in the order above.
# A glossary is a document named by a kind's `terms`: each list item starts with a bold term, and may list under it
# "Also called", "In code", "Used in" and "Ambiguous" (decision 0031).
language: ru
groups:
  product: { en: "Product knowledge", ru: "Знания о продукте" }
  code: { en: "Code", ru: "Код" }
  contracts: { en: "Contracts", ru: "Контракты" }
  data: { en: "Data", ru: "Данные" }
  operations: { en: "Operations", ru: "Эксплуатация" }
  tests: { en: "Tests", ru: "Тесты" }
  history: { en: "History", ru: "История" }
documents:
  exclude: [AGENTS.md, CLAUDE.md, GEMINI.md, "**/AGENTS.md", "**/CLAUDE.md", "**/GEMINI.md"]
roles:
  product: { lead: [product, tests], open: [stated, implementedby, linkedfrom, related, properties] }
  analyst: { lead: [product, data, contracts], open: [stated, implementedby, linkedfrom, related, properties, er, sequence, children] }
  architect: { lead: [product, code, contracts, data], open: [graph, related, sequence, er, stated, implementedby, linkedfrom, properties, children] }
  developer: { lead: [code, contracts, data, tests], open: [source, callers, callees, sequence, graph, related, properties, children, er, stated] }
  operations: { lead: [operations, data, contracts], open: [properties, related, children, source, er, stated] }
  tester: { lead: [tests, product], open: [stated, implementedby, linkedfrom, related, properties, callers, children] }
kinds:
  product:
    template: templates/product.md
    source: markdown
    group: product
    file: docs/product.md
    labels:
      en: { one: "Product", many: "Products" }
      ru: { one: "Продукт", many: "Продукты" }
    description:
      en: "What the product is, for whom, and its architecture: the home page the agent writes."
      ru: "Что это за продукт, для кого и как устроен: главная страница, которую пишет агент."
  domain:
    template: templates/domain.md
    source: markdown
    group: product
    folder: docs/domains
    labels:
      en: { one: "Domain", many: "Domains" }
      ru: { one: "Домен", many: "Домены" }
    description:
      en: "A part of the business the product serves, such as payment or ordering: how it works and what implements it."
      ru: "Часть бизнеса, которую обслуживает продукт, например оплата или заказы: как она работает и что её реализует."
  doc.use-case:
    template: templates/entity-text.md
    source: document
    group: product
    origin: person
    identifier: UC
    labels:
      en: { one: "Use case", many: "Use cases" }
      ru: { one: "Сценарий", many: "Сценарии" }
    description:
      en: "A way a person uses the product (UC-1, UC-2 ...), as the documents state it."
      ru: "Способ, которым человек пользуется продуктом (UC-1, UC-2 ...), как его описывают документы."
  doc.rule:
