edges:
  - name: code.contains
    from:
      - code.repository
      - code.directory
    to:
      - code.directory
      - code.file
      - code.gitlink
    capability: git
  - name: code.as-is
    from:
      - code.repository
    to:
      - code.commit
    capability: git
  - name: code.history
    from:
      - code.repository
    to:
      - code.commit
    capability: git
  - name: code.parent
    from:
      - code.commit
    to:
      - code.commit
    capability: git
  - name: code.touched
    from:
      - code.commit
    to:
      - code.file
    capability: git
  - name: code.authored
    from:
      - code.author
    to:
      - code.commit
    capability: git
  - name: code.renamed-from
    from:
      - code.file
    to:
      - code.file
    repeats: true
    discriminator: commit
    capability: git
